[package]
name = "marketplace"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

# The binary, src/main.rs: the server, which reads the settings once (pluribus-services' config),
# serves the site's pages (pluribus-web) and, beside them under /api/v1, its JSON API
# (pluribus-api), over one state, and rebuilds now and then the figures they read (pluribus-db).
# The site itself is the crates under crates/, one for each of its parts, each with its own tests
# (README, "Project layout").
[dependencies]
pluribus-api.workspace = true
pluribus-db.workspace = true
pluribus-services.workspace = true
pluribus-web.workspace = true
anyhow.workspace = true
axum.workspace = true
dotenvy.workspace = true
sqlx.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[workspace]
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"

# Every crate's dependencies, at one version and with one set of features for the whole
# workspace; each crate names those it uses (`anyhow.workspace = true`).
[workspace.dependencies]
pluribus-api = { path = "crates/api" }
pluribus-core = { path = "crates/core" }
pluribus-db = { path = "crates/db" }
pluribus-services = { path = "crates/services" }
pluribus-web = { path = "crates/web" }
anyhow = "1.0.104"
base64 = "0.22"
askama = "0.14.0"
axum = { version = "0.8.9", features = ["multipart"] }
dotenvy = "0.15.7"
form_urlencoded = "1.2.2"
futures-util = { version = "0.3", default-features = false }
# The cards' copies are AVIF too (media.rs): rav1e, Rust's AV1 encoder, by way of ravif, without
# its assembly, which needs NASM to build, as mozjpeg's SIMD does.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "avif"] }
# Photos are kept as lossy WebP (libwebp, built from its C sources), with a JPEG copy by mozjpeg
# for browsers without WebP and link previews (media.rs). mozjpeg's SIMD needs NASM to build, so
# it goes without; its errors unwind through C as panics, which media.rs catches. Neither builds
# its C in parallel, which would take another crate (jobserver).
libwebp-sys = { version = "0.14", default-features = false, features = ["std"] }
mozjpeg = { version = "0.10", default-features = false }
mozjpeg-sys = { version = "2.2", default-features = false, features = ["unwinding"] }
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls-tls", "hostname"] }
object_store = { version = "0.12", default-features = false, features = ["aws"] }
# The site's scripts go minified (pluribus-web's minified_js): Oxc parses one, shortens it (its
# comments and white space, its local names) and writes it out again.
oxc_allocator = "0.153"
oxc_codegen = "0.153"
oxc_minifier = "0.153"
oxc_parser = "0.153"
oxc_span = "0.153"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rust_decimal = "1.43.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "postgres", "macros", "migrate", "uuid", "time", "rust_decimal", "json"] }
# With `serde` and `serde-well-known`, a time goes into JSON as RFC 3339 (`time::serde::rfc3339`),
# as the JSON API gives it (pluribus-api).
time = { version = "0.3.45", features = ["formatting", "macros", "serde", "serde-well-known"] }
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread", "net", "signal", "time"] }
tower-http = { version = "0.7.1", features = ["fs", "trace", "compression-gzip", "compression-br"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.26.1", features = ["serde"] }
# The request tests' (crates/web/tests).
http-body-util = "0.1.5"
tower = { version = "0.5.3", features = ["util"] }

# A card's AVIF copy, which the tests make, takes rav1e many seconds unoptimised, with the crates it
# works with, and with its checks: the tests' builds optimise every dependency, as the release
# does, and leave rav1e's checks out. The site's own crates, the workspace's, build as before
# (media.rs keeps rav1e's work out of them).
[profile.dev.package."*"]
opt-level = 3

[profile.dev.package.rav1e]
debug-assertions = false
overflow-checks = false
