{#- After a listing's price, when it dropped lately (listings.rs, price_drop): what it was,
    struck through, and by how much, in green (listing.css). -#}
{%- if let Some((percent, was)) = price_drop %}<span class="price-was"><span class="visually-hidden">{{ crate::t("Çmimi ishte") }} </span><del>{{ was }}</del> <span class="price-drop">−{{ percent }}%</span></span>{% endif -%}
