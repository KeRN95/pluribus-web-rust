# Local development services. Start them with: docker compose up -d
# The photo store needs a one-time setup after its first start: sh dev/setup_garage.sh
services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: marketplace
      POSTGRES_PASSWORD: marketplace
      POSTGRES_DB: marketplace
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketplace"]
      interval: 2s
      retries: 30

  # Photos: Garage, an S3-compatible object store, so the app talks to it exactly as it will to
  # Cloudflare R2 in production (see .env.example). S3 API on port 3900.
  garage:
    image: dxflrs/garage:v2.4.1
    ports:
      - "3900:3900"
    volumes:
      - ./dev/garage.toml:/etc/garage.toml:ro
      - garage:/var/lib/garage

volumes:
  pgdata:
  garage:
