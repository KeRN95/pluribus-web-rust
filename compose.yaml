# Local development services. Start them with: docker compose up -d
# The photo store needs a one-time setup after its first start: sh dev/setup_garage.sh
services:
  db:
    image: postgres:15-alpine
    # Speed over durability, as a development database can afford: no waiting for the disk on each
    # commit (fsync, synchronous_commit, full_page_writes off), which makes the tests' databases,
    # each migrated from nothing, two to three times quicker to make; enough lock memory and
    # connections for a dozen of them migrating at once (max_locks_per_transaction,
    # max_connections); and a bigger shared memory for parallel vacuums and sorts than Docker's
    # 64 MB (shm_size). A crash mid-write could corrupt this database; regenerate it then.
    command: postgres -c fsync=off -c synchronous_commit=off -c full_page_writes=off -c max_locks_per_transaction=512 -c max_connections=300
    shm_size: 256mb
    environment:
      POSTGRES_USER: marketplace
      POSTGRES_PASSWORD: marketplace
      POSTGRES_DB: marketplace
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketplace"]
      interval: 2s
      retries: 30

  # Photos: Garage, an S3-compatible object store, so the app talks to it exactly as it will to
  # Cloudflare R2 in production (see .env.example). S3 API on port 3900.
  garage:
    image: dxflrs/garage:v2.4.1
    ports:
      - "3900:3900"
    volumes:
      - ./dev/garage.toml:/etc/garage.toml:ro
      - garage:/var/lib/garage

volumes:
  pgdata:
  garage:
