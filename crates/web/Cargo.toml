[package]
name = "pluribus-web"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

# The site's pages: the router and its layers, the handlers, the filters, the icons, the rail, the
# languages' layer, what search engines read, the stylesheets and scripts as pages get them, and
# the app's constructors (`app`, `app_with`, `app_with_ai`). Its templates are the repository's
# templates/ (askama.toml), compiled in; static/ is read at run time from the directory the
# server runs in, the repository's root.
